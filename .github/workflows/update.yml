name: update-data
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch data
        run: python fetch.py
      - name: commit data
        run: |
          git config user.name "ghost-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "data update" || echo "no changes"
          git push
